apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ytzero-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ytzero
  labels:
    app.kubernetes.io/name: ytzero
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ytzero
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ytzero
    spec:
      containers:
        - name: ytzero
          image: ghcr.io/pelski/ytzero:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ytzero-data
---
apiVersion: v1
kind: Service
metadata:
  name: ytzero
  labels:
    app.kubernetes.io/name: ytzero
spec:
  selector:
    app.kubernetes.io/name: ytzero
  ports:
    - name: http
      port: 80
      targetPort: http
