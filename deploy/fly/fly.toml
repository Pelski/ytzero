primary_region = "fra"

[build]
  image = "ghcr.io/pelski/ytzero:latest"

[env]
  PORT = "3001"
  IDLE_TIMEOUT_SECONDS = "120"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[mounts]]
  source = "ytzero_data"
  destination = "/data"
  initial_size = "10gb"
  snapshot_retention = 14

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
