name: Bug report
description: Report something that is not working as expected
title: "bug: "
labels: ["bug"]
assignees: ["Pelski"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!

        Before opening an issue, please check the [existing issues](https://github.com/Pelski/ytzero/issues?q=is%3Aissue).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, what you expected instead, and add screenshots if useful.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps that reliably trigger the problem.
      placeholder: |
        1. Go to...
        2. Click...
        3. See...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste relevant output from Settings → Advanced → Logs or the browser console.
        Remove passwords, cookies, tokens, and other sensitive data first.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Find the YT Zero version in Settings → Advanced → Logs.
      placeholder: |
        YT Zero version:
        Installation method:
        Browser:
        Operating system:
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Please confirm
      options:
        - label: I searched for an existing issue that describes this problem.
          required: true
