name: Feature request
description: Suggest an improvement or a new capability
title: "feat: "
labels: ["enhancement"]
assignees: ["Pelski"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest an improvement!

        Please describe the need as well as the feature itself.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation or limitation you are running into.
      placeholder: I am unable to... because...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature or behaviour you would find useful.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, screenshots, a suggested flow, alternatives, or current workarounds if useful.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Please confirm
      options:
        - label: I searched for an existing issue that covers this request.
          required: true
