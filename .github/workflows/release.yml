name: Publish Release

# Pushing a YYYY.MM.N tag creates a GitHub Release with a list of commits
# made since the previous tag, plus a tarball with a prebuilt UI that
# scripts/install.sh downloads (native installs must not build the frontend
# on the target host).
# After this workflow succeeds, docker-ghcr.yml builds the image for the same
# tagged commit and the already-published release.
on:
  push:
    tags:
      - "[1-9][0-9][0-9][0-9].0[1-9].[1-9]*"
      - "[1-9][0-9][0-9][0-9].1[0-2].[1-9]*"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    name: Build and publish the release assets
    runs-on: ubuntu-latest
    steps:
      - name: Validate the release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^[1-9][0-9]{3}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}. Expected YYYY.MM.N (for example 2026.08.1)." >&2
            exit 1
          fi

      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the Bun runtime
        uses: oven-sh/setup-bun@v2

      - name: Install web client dependencies
        run: |
          set -euo pipefail
          cd ui
          bun install --frozen-lockfile

      - name: Generate the bundled changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YTZERO_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd ui
          bun run generate:changelog

      - name: Build the production web client with the prepared changelog
        run: |
          set -euo pipefail
          cd ui
          bun run build:prepared

      # Same layout as the Docker image: src/, package.json and the built UI in
      # public/, so both runtimes start with the identical command.
      - name: Package the release archive
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          stage="ytzero-${tag}"

          mkdir -p "${stage}/public"
          cp -r app/src "${stage}/src"
          cp app/package.json "${stage}/package.json"
          cp app/bun.lock "${stage}/bun.lock"
          cp -r ui/dist/. "${stage}/public/"
          echo "${tag}" > "${stage}/VERSION"

          tar -czf "ytzero-${tag}.tar.gz" "${stage}"
          sha256sum "ytzero-${tag}.tar.gz" > "ytzero-${tag}.tar.gz.sha256"

      - name: Generate release notes from commits
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          headline="$(git log -1 --pretty=format:%s "${tag}")"
          echo "title=${tag} — ${headline}" >> "${GITHUB_OUTPUT}"

          {
            echo "## Changes"
            echo

            if [[ -n "${previous_tag}" ]]; then
              git log \
                --no-merges \
                --pretty=format:'- %s (`%h`)' \
                "${previous_tag}..${tag}"
              echo
              echo
              echo "[View full comparison](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous_tag}...${tag})"
            else
              git log \
                --no-merges \
                --pretty=format:'- %s (`%h`)' \
                "${tag}"
              echo
            fi
          } > release-notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: ${{ steps.release-notes.outputs.title }}
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            --title "${RELEASE_TITLE}" \
            --notes-file release-notes.md \
            --latest \
            --verify-tag \
            "ytzero-${GITHUB_REF_NAME}.tar.gz" \
            "ytzero-${GITHUB_REF_NAME}.tar.gz.sha256"

  publish-website:
    name: Publish the project website
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
