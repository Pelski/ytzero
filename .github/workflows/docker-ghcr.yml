name: Publish Container Image

on:
  push:
    branches:
      - main
    tags:
      - "[1-9][0-9][0-9][0-9].0[1-9].[1-9]*"
      - "[1-9][0-9][0-9][0-9].1[0-2].[1-9]*"
    # A README, wiki page or issue-workflow change cannot affect the image.
    paths:
      - "app/**"
      - "ui/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pelski/ytzero

jobs:
  prepare:
    name: Prepare release metadata and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build-version.outputs.version }}
      commit: ${{ steps.build-version.outputs.commit }}
      short_commit: ${{ steps.build-version.outputs.short_commit }}
      is_release: ${{ steps.build-version.outputs.is_release }}
      is_edge: ${{ steps.build-version.outputs.is_edge }}
      release_year_month: ${{ steps.build-version.outputs.release_year_month }}
      release_year: ${{ steps.build-version.outputs.release_year }}
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the image version from the checked-out source
        id: build-version
        shell: bash
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"
          version="edge"
          is_release="false"
          is_edge="false"
          # Disabled raw-tag rules still receive syntactically valid values on
          # branch builds; release refs replace both placeholders below.
          release_year_month="edge"
          release_year="edge"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            is_edge="true"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            if [[ ! "${version}" =~ ^[1-9][0-9]{3}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$ ]]; then
              echo "Invalid release tag: ${version}. Expected YYYY.MM.N (for example 2026.08.1)." >&2
              exit 1
            fi

            is_release="true"
            is_edge="false"
            release_year_month="${version%.*}"
            release_year="${version%%.*}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"
          echo "short_commit=${commit:0:7}" >> "${GITHUB_OUTPUT}"
          echo "is_release=${is_release}" >> "${GITHUB_OUTPUT}"
          echo "is_edge=${is_edge}" >> "${GITHUB_OUTPUT}"
          echo "release_year_month=${release_year_month}" >> "${GITHUB_OUTPUT}"
          echo "release_year=${release_year}" >> "${GITHUB_OUTPUT}"

      - name: Set up the Bun runtime
        uses: oven-sh/setup-bun@v2

      - name: Generate changelog before the container build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YTZERO_VERSION: ${{ steps.build-version.outputs.version }}
        run: |
          set -euo pipefail
          cd ui
          bun install --frozen-lockfile
          bun run generate:changelog

      - name: Store the prepared changelog
        uses: actions/upload-artifact@v7
        with:
          name: prepared-changelog
          path: ui/public/changelog.json
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build the Linux image for ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare the platform artifact name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Check out the prepared source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Restore the prepared changelog
        uses: actions/download-artifact@v8
        with:
          name: prepared-changelog
          path: ui/public

      - name: Generate OCI image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set up the Docker Buildx builder
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the platform image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # A completed release workflow supplies YYYY.MM.N; main builds use edge.
          build-args: |
            YTZERO_VERSION=${{ needs.prepare.outputs.version }}
            YTZERO_COMMIT=${{ needs.prepare.outputs.commit }}
            YTZERO_CHANGELOG_PREGENERATED=1
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Store the platform image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the platform image digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish the multi-platform image
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download platform image digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Generate the final image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main → edge + sha-xxxx (bleeding edge)
          # release YYYY.MM.N → YYYY.MM.N, YYYY.MM, YYYY, latest oraz sha-xxxx
          tags: |
            type=raw,value=edge,enable=${{ needs.prepare.outputs.is_edge == 'true' }}
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.is_release == 'true' }}
            type=raw,value=${{ needs.prepare.outputs.release_year_month }},enable=${{ needs.prepare.outputs.is_release == 'true' }}
            type=raw,value=${{ needs.prepare.outputs.release_year }},enable=${{ needs.prepare.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_release == 'true' }}
            type=raw,value=sha-${{ needs.prepare.outputs.short_commit }}

      - name: Sign in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the multi-platform image manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Verify the published edge image manifest
        if: needs.prepare.outputs.is_edge == 'true'
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:edge"

      - name: Verify the published commit image manifest
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.short_commit }}"

      - name: Verify the published release image manifests
        if: needs.prepare.outputs.is_release == 'true'
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.release_year_month }}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.release_year }}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
